[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sngsr-baseline"
version = "1.0.0"
description = "Baseline for the SoccerNet 2027 Long Form Game State Reconstruction challenge"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["sngsr*", "yolox*"]
